[project]
name = "resend-email-skill"
version = "0.1.0"
description = "AI-first Resend email send/receive CLI skill"
requires-python = ">=3.11"
dependencies = [
  "resend>=2.35.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "markdown>=3.5.0",
  "markdownify>=0.11.6",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4,<0.16",
]

[project.scripts]
resend-email = "resend_email_skill.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
  "live_integration: tests that call the real Resend API and are skipped by default",
]

[tool.setuptools.packages.find]
where = ["src"]
